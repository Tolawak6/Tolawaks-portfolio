<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sample project placeholder: task tracker interface">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FDBF2D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#050505"/>
  <rect width="800" height="500" fill="url(#grid1)"/>

  <!-- Window chrome -->
  <rect x="56" y="48" width="688" height="392" rx="8" fill="#0E0E0E" stroke="#F7F5F0" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="56" y="48" width="688" height="40" rx="8" fill="#141414"/>
  <line x1="56" y1="88" x2="744" y2="88" stroke="#FDBF2D" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="84" cy="68" r="5.5" fill="#FDBF2D"/>
  <circle cx="104" cy="68" r="5.5" fill="#F7F5F0" fill-opacity="0.24"/>
  <circle cx="124" cy="68" r="5.5" fill="#F7F5F0" fill-opacity="0.14"/>

  <!-- Board columns -->
  <g fill="#080808" stroke="#F7F5F0" stroke-opacity="0.1" stroke-width="1">
    <rect x="84" y="112" width="196" height="302" rx="6"/>
    <rect x="302" y="112" width="196" height="302" rx="6"/>
    <rect x="520" y="112" width="196" height="302" rx="6"/>
  </g>

  <!-- Column headers -->
  <rect x="100" y="128" width="68" height="8" rx="2" fill="#FDBF2D"/>
  <rect x="318" y="128" width="84" height="8" rx="2" fill="#F7F5F0" fill-opacity="0.45"/>
  <rect x="536" y="128" width="58" height="8" rx="2" fill="#F7F5F0" fill-opacity="0.45"/>

  <!-- Cards -->
  <g fill="#161616">
    <rect x="100" y="152" width="164" height="58" rx="4"/>
    <rect x="100" y="222" width="164" height="58" rx="4"/>
    <rect x="318" y="152" width="164" height="58" rx="4"/>
    <rect x="318" y="222" width="164" height="58" rx="4"/>
    <rect x="318" y="292" width="164" height="58" rx="4"/>
    <rect x="536" y="152" width="164" height="58" rx="4"/>
  </g>

  <!-- Solar Gold accent bars -->
  <g fill="#FDBF2D">
    <rect x="100" y="152" width="4" height="58" rx="1"/>
    <rect x="318" y="222" width="4" height="58" rx="1"/>
    <rect x="536" y="152" width="4" height="58" rx="1"/>
  </g>

  <!-- Card text lines -->
  <g fill="#F7F5F0" fill-opacity="0.55">
    <rect x="116" y="168" width="108" height="8" rx="2"/>
    <rect x="116" y="184" width="76" height="6" rx="2" fill-opacity="0.28"/>
    <rect x="334" y="238" width="118" height="8" rx="2"/>
    <rect x="334" y="254" width="88" height="6" rx="2" fill-opacity="0.28"/>
    <rect x="552" y="168" width="96" height="8" rx="2"/>
    <rect x="552" y="184" width="64" height="6" rx="2" fill-opacity="0.28"/>
  </g>

  <text x="400" y="476" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" font-weight="700" letter-spacing="4" fill="#FDBF2D" fill-opacity="0.72">01 // TASK TRACKER UI</text>
</svg>
