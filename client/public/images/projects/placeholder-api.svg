<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sample project placeholder: REST API response">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FDBF2D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#050505"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <rect x="56" y="48" width="688" height="392" rx="8" fill="#0E0E0E" stroke="#F7F5F0" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="56" y="48" width="688" height="40" rx="8" fill="#141414"/>
  <line x1="56" y1="88" x2="744" y2="88" stroke="#FDBF2D" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="84" cy="68" r="5.5" fill="#FDBF2D"/>
  <circle cx="104" cy="68" r="5.5" fill="#F7F5F0" fill-opacity="0.24"/>
  <circle cx="124" cy="68" r="5.5" fill="#F7F5F0" fill-opacity="0.14"/>

  <!-- JSON / API response tokens -->
  <g>
    <rect x="92" y="128" width="110" height="10" rx="3" fill="#FDBF2D"/>
    <rect x="214" y="128" width="196" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.28"/>

    <rect x="112" y="162" width="86" height="10" rx="3" fill="#FDBF2D" fill-opacity="0.82"/>
    <rect x="210" y="162" width="152" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.5"/>

    <rect x="112" y="196" width="136" height="10" rx="3" fill="#FDBF2D" fill-opacity="0.82"/>
    <rect x="260" y="196" width="96" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.3"/>

    <rect x="132" y="230" width="104" height="10" rx="3" fill="#FDBF2D"/>
    <rect x="248" y="230" width="176" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.45"/>

    <rect x="132" y="264" width="76" height="10" rx="3" fill="#FDBF2D" fill-opacity="0.75"/>
    <rect x="220" y="264" width="132" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.28"/>

    <rect x="112" y="298" width="118" height="10" rx="3" fill="#F7F5F0" fill-opacity="0.4"/>
    <rect x="92" y="332" width="94" height="10" rx="3" fill="#FDBF2D"/>
  </g>

  <!-- HTTP method / status badges on the right -->
  <g>
    <rect x="548" y="124" width="156" height="32" rx="4" fill="#FDBF2D"/>
    <text x="626" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#000000">GET 200 OK</text>

    <rect x="548" y="172" width="156" height="32" rx="4" fill="#181818" stroke="#FDBF2D" stroke-opacity="0.45"/>
    <text x="626" y="193" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FDBF2D">POST 201</text>

    <rect x="548" y="220" width="156" height="32" rx="4" fill="#181818" stroke="#F7F5F0" stroke-opacity="0.18"/>
    <text x="626" y="241" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#D6D3CB">PUT /items/:id</text>

    <rect x="548" y="268" width="156" height="32" rx="4" fill="#181818" stroke="#F7F5F0" stroke-opacity="0.18"/>
    <text x="626" y="289" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#9E9A8F">POSTGRESQL</text>
  </g>

  <text x="400" y="476" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" font-weight="700" letter-spacing="4" fill="#FDBF2D" fill-opacity="0.72">02 // REST API SERVICE</text>
</svg>
