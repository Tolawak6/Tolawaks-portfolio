  <rect width="800" height="500" fill="url(#bg3)"/>

  <rect x="60" y="58" width="680" height="384" rx="12" fill="#27374D" fill-opacity="0.36" stroke="#DDE6ED" stroke-opacity="0.14" stroke-width="2"/>
