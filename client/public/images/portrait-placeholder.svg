        font-size="132" font-weight="800" letter-spacing="10" fill="#FDBF2D">TM</text>

  <text x="600" y="1268" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="30" letter-spacing="6" fill="#F7F5F0" fill-opacity="0.72">PORTRAIT PLACEHOLDER</text>
  <text x="600" y="1322" text-anchor="middle"
