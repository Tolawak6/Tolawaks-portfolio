<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Placeholder portrait">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#FDBF2D" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#FDBF2D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="#000000"/>
