<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Tolawak Merga - Full-Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27374D"/>
      <stop offset="100%" stop-color="#1F2C3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#526D82" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#526D82" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DDE6ED" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Monogram mark -->
  <g>
    <rect x="88" y="150" width="82" height="82" rx="12" fill="#526D82" stroke="#DDE6ED" stroke-opacity="0.18" stroke-width="2"/>
    <text x="129" y="204" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="34" font-weight="700" fill="#DDE6ED" letter-spacing="2">TM</text>
  </g>

  <!-- Name -->
  <text x="88" y="330"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" fill="#DDE6ED" letter-spacing="-2.5">Tolawak Merga</text>

  <!-- Title -->
  <text x="88" y="392"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="32" fill="#DDE6ED" fill-opacity="0.72" letter-spacing="0.5">Full-Stack Web Developer</text>

  <!-- Rule -->
  <rect x="88" y="440" width="88" height="3" rx="1.5" fill="#526D82"/>

  <!-- Stack line -->
  <text x="88" y="502"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="23" fill="#DDE6ED" fill-opacity="0.5" letter-spacing="1">React · Node.js · Express · PostgreSQL</text>

  <!-- Frame -->
  <rect x="16" y="16" width="1168" height="598" rx="18" fill="none" stroke="#DDE6ED" stroke-opacity="0.1" stroke-width="2"/>
</svg>
